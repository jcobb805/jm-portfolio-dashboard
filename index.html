<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scarlet Portfolio Dashboard (Private)</title>
<meta name="robots" content="noindex,nofollow">
<style>
  html, body { margin:0; padding:0; height:100%; background:#1B3160; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  #gate { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; }
  .card { background:#fff; color:#1B3160; padding:36px 44px; border-radius:12px; min-width:340px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  .title { font-size:22px; font-weight:700; color:#1B3160; margin-bottom:6px; }
  .subtitle { font-size:13px; color:#6B7280; margin-bottom:20px; }
  input[type=password] { width:100%; box-sizing:border-box; background:#F9FAFB; color:#111827; border:1px solid #D1D5DB; padding:10px 14px; border-radius:6px; font-size:14px; margin-bottom:12px; outline:none; }
  input[type=password]:focus { border-color:#DA291C; }
  button { width:100%; background:#DA291C; color:#fff; border:none; padding:10px 16px; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; }
  button:hover { background:#B01E15; }
  .err { color:#DA291C; font-size:12px; margin-top:10px; min-height:14px; }
  .loading { color:#6B7280; font-size:13px; margin-top:12px; }
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <div class="title">Scarlet Portfolio Dashboard</div>
    <div class="subtitle">Private — password required</div>
    <input id="pwd" type="password" placeholder="Password" autofocus
           onkeydown="if(event.key==='Enter') unlock()">
    <button onclick="unlock()">Unlock</button>
    <div id="err" class="err"></div>
    <div id="loading" class="loading"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script>
function unlock() {
  const pwd = document.getElementById('pwd').value;
  const err = document.getElementById('err');
  const loading = document.getElementById('loading');
  err.textContent = '';
  if (!pwd) { err.textContent = 'Enter password'; return; }
  loading.textContent = 'Decrypting…';
  fetch('dashboard.html.enc?' + Date.now())
    .then(r => r.ok ? r.text() : Promise.reject('Could not load encrypted file'))
    .then(enc => {
      const decrypted = CryptoJS.AES.decrypt(enc.trim(), pwd).toString(CryptoJS.enc.Utf8);
      if (!decrypted) throw new Error('Invalid password');
      try { sessionStorage.setItem('jmDashPwd', pwd); } catch(e){}
      document.open();
      document.write(decrypted);
      document.close();
    })
    .catch(e => {
      loading.textContent = '';
      err.textContent = 'Invalid password';
    });
}
// Auto-unlock if previously authenticated this session
(function(){
  try {
    const saved = sessionStorage.getItem('jmDashPwd');
    if (saved) {
      document.getElementById('pwd').value = saved;
      unlock();
    }
  } catch(e){}
})();
</script>
</body>
</html>
